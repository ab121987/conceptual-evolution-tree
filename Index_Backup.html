<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A research matrix mapping digital-physical discourse against system openness."
  />
  <title>Material Systems Research Matrix</title>
  <style>
    :root {
      --ink: #101010;
      --paper: #f2f0e9;
      --panel: #fbfaf5;
      --muted: #696962;Wg
      --line: rgba(16, 16, 16, 0.24);
      --line-strong: #101010;
      --accent: #ff3d00;
      --reviewer-ai: #00c2ff;
      --reviewer-other: #8a5cff;
      --accent-soft: rgba(255, 61, 0, 0.12);
      --font: Arial, Helvetica, sans-serif;
      --space: clamp(1rem, 2vw, 2rem);
      --matrix-padding: clamp(2.25rem, 7vw, 5rem);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      min-width: 320px;
      margin: 0;
      background:
        linear-gradient(90deg, transparent 49.9%, rgba(16, 16, 16, 0.035) 50%, transparent 50.1%),
        var(--paper);
      color: var(--ink);
      font-family: var(--font);
    }

    button {
      font: inherit;
    }

    .page-shell {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: var(--space);
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 0.45fr);
      gap: var(--space);
      padding: 0 0 var(--space);
      border-bottom: 3px solid var(--line-strong);
    }

    .eyebrow,
    .panel-label,
    .axis-end,
    .axis-name,
    .quadrant-title,
    .meta-label,
    .marker-index {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 0.75rem;
    }

    .eyebrow::before {
      width: 0.7rem;
      height: 0.7rem;
      background: var(--accent);
      content: "";
    }

    h1 {
      max-width: 13ch;
      margin: 0;
      font-size: clamp(2.35rem, 6vw, 6rem);
      letter-spacing: -0.065em;
      line-height: 0.86;
      text-transform: uppercase;
    }

    .subtitle {
      align-self: end;
      margin: 0;
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .framing {
      display: grid;
      grid-template-columns: 8rem minmax(0, 48rem);
      gap: 1rem;
      padding: 1.15rem 0;
      border-bottom: 1px solid var(--line-strong);
    }

    .framing p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
      gap: var(--space);
      padding-top: var(--space);
      align-items: start;
    }

    .matrix-frame {
      position: relative;
      min-height: 620px;
      aspect-ratio: 1 / 1;
      overflow: visible;
      border: 1px solid var(--line-strong);
      background: var(--panel);
    }

    .matrix-plot {
      position: absolute;
      inset: var(--matrix-padding);
      background:
        linear-gradient(to right, transparent calc(50% - 0.5px), var(--line) 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), var(--line) 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 12.5% 100%, 100% 12.5%;
    }

    .contest-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .contest-area {
      fill: color-mix(in srgb, var(--active-paper-color, var(--accent)) 16%, transparent);
      stroke: var(--active-paper-color, var(--accent));
      stroke-dasharray: 6 5;
      stroke-linejoin: bevel;
      stroke-width: 2;
      opacity: 0;
      transition: opacity 140ms ease;
    }

    .contest-area.is-active {
      opacity: 1;
    }

    .matrix-plot::before,
    .matrix-plot::after {
      display: none;
    }

    .cross-axis {
      position: absolute;
      z-index: 3;
      background: var(--line-strong);
      pointer-events: none;
    }

    .cross-axis-x {
      top: calc(50% - 2.5px);
      left: 10px;
      width: calc(100% - 20px);
      height: 5px;
    }

    .cross-axis-y {
      bottom: 10px;
      left: calc(50% - 2.5px);
      width: 5px;
      height: calc(100% - 20px);
    }

    .cross-axis::before,
    .cross-axis::after {
      position: absolute;
      width: 0;
      height: 0;
      content: "";
    }

    .cross-axis-x::before {
      top: -5px;
      left: -10px;
      border-top: 7px solid transparent;
      border-right: 10px solid var(--ink);
      border-bottom: 7px solid transparent;
    }

    .cross-axis-x::after {
      top: -5px;
      right: -10px;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 10px solid var(--ink);
    }

    .cross-axis-y::before {
      top: -10px;
      left: -5px;
      border-right: 7px solid transparent;
      border-bottom: 10px solid var(--ink);
      border-left: 7px solid transparent;
    }

    .cross-axis-y::after {
      bottom: -10px;
      left: -5px;
      border-top: 10px solid var(--ink);
      border-right: 7px solid transparent;
      border-left: 7px solid transparent;
    }

    .quadrant {
      position: absolute;
      z-index: 1;
      width: 50%;
      height: 50%;
      padding: clamp(0.65rem, 1.5vw, 1.15rem);
      pointer-events: none;
    }

    .quadrant[data-quadrant="top_left"] {
      top: 0;
      left: 0;
    }

    .quadrant[data-quadrant="top_right"] {
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .quadrant[data-quadrant="bottom_left"] {
      bottom: 0;
      left: 0;
    }

    .quadrant[data-quadrant="bottom_right"] {
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      text-align: right;
    }

    .quadrant-title {
      display: block;
      max-width: 28ch;
    }

    .quadrant-description {
      max-width: 36ch;
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: clamp(0.6rem, 1vw, 0.76rem);
      line-height: 1.3;
    }

    .axis-name,
    .axis-end {
      position: absolute;
      z-index: 3;
    }

    .axis-name-x {
      bottom: 0.55rem;
      left: var(--matrix-padding);
      text-align: left;
    }

    .axis-name-y {
      bottom: var(--matrix-padding);
      left: 0.45rem;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .axis-end {
      color: var(--muted);
      font-size: 0.58rem;
    }

    .axis-x-start {
      bottom: 2rem;
      left: var(--matrix-padding);
    }

    .axis-x-end {
      right: var(--matrix-padding);
      bottom: 2rem;
      text-align: right;
    }

    .axis-y-start {
      bottom: var(--matrix-padding);
      left: 1.9rem;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .axis-y-end {
      top: var(--matrix-padding);
      left: 1.9rem;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .paper-marker {
      position: absolute;
      z-index: 5;
      isolation: isolate;
      display: grid;
      width: 30px;
      height: 30px;
      padding: 0;
      place-items: center;
      --marker-color: var(--accent);
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--marker-color);
      color: var(--ink);
      cursor: pointer;
      transform: translate(-50%, 50%);
      transition: opacity 140ms ease, transform 120ms ease, background 120ms ease, color 120ms ease;
    }

    .paper-marker.reviewer-ai {
      --marker-color: var(--reviewer-ai);
    }

    .paper-marker.reviewer-other-human {
      --marker-color: var(--reviewer-other);
    }

    .paper-marker.is-secondary-assessment {
      opacity: 0.42;
    }

    .paper-marker.is-muted {
      opacity: 0.14;
    }

    .paper-marker.is-related {
      opacity: 1;
    }

    .paper-marker::before {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .paper-marker.confidence-medium {
      border-style: dashed;
      background: color-mix(in srgb, var(--marker-color) 82%, transparent);
    }

    .paper-marker.confidence-medium::before {
      inset: -12px;
      border: 1px dashed color-mix(in srgb, var(--marker-color) 65%, transparent);
      background: radial-gradient(circle, color-mix(in srgb, var(--marker-color) 20%, transparent), transparent);
      filter: blur(2px);
    }

    .paper-marker.confidence-low {
      border: 0;
      background: color-mix(in srgb, var(--marker-color) 28%, transparent);
      color: var(--ink);
    }

    .paper-marker.confidence-low::before {
      inset: -42px;
      clip-path: polygon(var(--bleed-points, 50% 0%, 95% 35%, 78% 100%, 18% 88%, 0% 24%));
      background: linear-gradient(
        var(--bleed-angle, 135deg),
        transparent 0%,
        color-mix(in srgb, var(--marker-color) 10%, transparent) 24%,
        color-mix(in srgb, var(--marker-color) 34%, transparent) 50%,
        color-mix(in srgb, var(--marker-color) 12%, transparent) 76%,
        transparent 100%
      );
      filter: blur(16px);
    }

    .paper-marker:hover,
    .paper-marker:focus-visible,
    .paper-marker.is-active {
      z-index: 10;
      background: var(--ink);
      color: var(--panel);
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      transform: translate(-50%, 50%) scale(1.15);
    }

    .paper-marker.confidence-medium:hover,
    .paper-marker.confidence-medium:focus-visible,
    .paper-marker.confidence-medium.is-active,
    .paper-marker.confidence-low:hover,
    .paper-marker.confidence-low:focus-visible,
    .paper-marker.confidence-low.is-active {
      background: var(--ink);
    }

    .marker-index {
      font-size: 0.6rem;
      letter-spacing: 0;
    }

    .detail-panel {
      position: sticky;
      top: var(--space);
      min-height: 420px;
      border-top: 8px solid var(--accent);
      background: var(--ink);
      color: var(--panel);
    }

    .detail-header,
    .detail-body {
      padding: 1rem;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.28);
    }

    .detail-count {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .empty-state {
      max-width: 24ch;
      margin: 2rem 0 0;
      color: #b5b5ae;
      font-size: 1rem;
      line-height: 1.4;
    }

    .paper-title {
      margin: 0 0 1rem;
      font-size: clamp(1.35rem, 2.5vw, 2rem);
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .paper-meta {
      display: grid;
      grid-template-columns: 5rem 1fr;
      gap: 0.45rem 0.75rem;
      margin: 0 0 1.25rem;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .paper-meta dd,
    .paper-meta dt {
      margin: 0;
    }

    .paper-meta a {
      color: var(--panel);
      font-weight: 800;
      text-decoration: underline;
      text-decoration-color: var(--panel);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }

    .paper-meta a:hover,
    .paper-meta a:focus-visible {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .paper-copy {
      margin: 0 0 1.25rem;
      color: #d6d6cf;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35rem;
      margin-top: 0.45rem;
    }

    .score {
      position: relative;
      padding: 0.55rem 0.3rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: help;
      text-align: center;
    }

    .score:hover,
    .score:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .score::after {
      position: absolute;
      z-index: 50;
      right: 0;
      bottom: calc(100% + 0.6rem);
      width: min(260px, 72vw);
      padding: 0.8rem;
      border: 2px solid var(--accent);
      background: #fbfaf5;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      color: var(--ink);
      content: attr(data-tooltip);
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: left;
      text-transform: none;
      visibility: hidden;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 100ms ease, transform 100ms ease;
      pointer-events: none;
    }

    .score:hover::after,
    .score:focus-visible::after {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    .score b {
      display: block;
      margin-top: 0.2rem;
      color: var(--accent);
      font-size: 1.15rem;
    }

    .status {
      padding: 2rem;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .workspace,
      .masthead {
        grid-template-columns: 1fr;
      }

      .matrix-frame {
        min-height: 0;
      }

      .detail-panel {
        position: static;
      }
    }

    @media (max-width: 620px) {
      :root {
        --matrix-padding: 2.4rem;
      }

      .framing {
        grid-template-columns: 1fr;
      }

      .quadrant-description {
        display: none;
      }

      .quadrant-title {
        font-size: 0.52rem;
      }

      .axis-name {
        font-size: 0.55rem;
      }

      .axis-end {
        display: none;
      }

      .paper-marker {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Heuristic Research Map / 2D Field</p>
        <h1 id="matrix-title">Loading matrix</h1>
      </div>
      <p class="subtitle" id="matrix-subtitle"></p>
    </header>

    <section class="framing" aria-labelledby="framing-label">
      <span class="panel-label" id="framing-label">Framing / 01</span>
      <p id="matrix-framing"></p>
    </section>

    <section class="workspace" aria-label="Research matrix and paper details">
      <div>
        <p class="panel-label" style="margin: 0 0 0.5rem 0;">
          Heuristic / Interpretive Map
        </p>

        <div class="matrix-frame" id="matrix-frame">
          <div
            class="matrix-plot"
            id="matrix-plot"
            role="group"
            aria-label="Research papers plotted by digital-physical discourse and system openness"
          >
            <svg class="contest-layer" id="contest-layer" aria-hidden="true"></svg>
            <span class="cross-axis cross-axis-x" aria-hidden="true"></span>
            <span class="cross-axis cross-axis-y" aria-hidden="true"></span>
          </div>

          <span class="axis-name axis-name-x" id="x-axis-name"></span>
          <span class="axis-name axis-name-y" id="y-axis-name"></span>
          <span class="axis-end axis-x-start" id="x-axis-start"></span>
          <span class="axis-end axis-x-end" id="x-axis-end"></span>
          <span class="axis-end axis-y-start" id="y-axis-start"></span>
          <span class="axis-end axis-y-end" id="y-axis-end"></span>
        </div>
      </div>

      <aside class="detail-panel" aria-live="polite">
        <div class="detail-header">
          <span class="panel-label">Paper record / Inspect</span>
          <span class="detail-count" id="paper-count">00</span>
        </div>
        <div class="detail-body" id="paper-detail">
          <p class="empty-state">Hover, focus, or click a marker to inspect its research record.</p>
        </div>
      </aside>
    </section>
  </main>

  <script src="script.js?v=15"></script>
</body>
</html>
